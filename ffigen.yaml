name: LibSmb2Bindings
description: FFI bindings for libsmb2 library (sync APIs only)
output: 'lib/src/smb_bindings_generated.dart'
language: c

llvm-path:
  - 'C:\Program Files\LLVM\bin'

headers:
  entry-points:
    - 'include/libsmb2_wrapper.h'
  include-directives:
    - '**libsmb2_wrapper.h'

compiler-opts:
  - '-Iinclude'

structs:
  include:
    - 'smb2_stat_64'
    - 'smb2dirent'
  exclude:
    - 'smb2_context'
    - 'smb2dir'
    - 'smb2fh'

enums:
  include: []

functions:
  include:
    - 'smb2_init_context'
    - 'smb2_destroy_context'
    - 'smb2_get_error'
    - 'smb2_set_timeout'
    - 'smb2_set_domain'
    - 'smb2_set_user'
    - 'smb2_set_password'
    - 'smb2_connect_share'
    - 'smb2_disconnect_share'
    - 'smb2_opendir'
    - 'smb2_readdir'
    - 'smb2_closedir'
    - 'smb2_open'
    - 'smb2_close'
    - 'smb2_read'
    - 'smb2_write'
    - 'smb2_pread'
    - 'smb2_pwrite'
    - 'smb2_stat'
    - 'smb2_fstat'
    - 'smb2_mkdir'
    - 'smb2_rmdir'
    - 'smb2_unlink'
    - 'smb2_rename'
    - 'smb2_lseek'
    - 'smb2_get_max_read_size'
    - 'smb2_get_max_write_size'
    - 'native_poll'
    - 'get_errno_value'

globals:
  exclude:
    - '.*'

macros:
  include:
    - 'SMB2_TYPE_FILE'
    - 'SMB2_TYPE_DIRECTORY'
    - 'SMB2_TYPE_LINK'

preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: constant_identifier_names
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unnecessary_brace_in_string_interps
  // ignore_for_file: unused_field
  // ignore_for_file: unused_element
  // GENERATED FILE - DO NOT MODIFY
  // This file is generated by ffigen. To regenerate, run:
  // dart run ffigen --config ffigen.yaml
